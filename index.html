<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>#FechadoComSérgioEODelegado</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f6f9;color:#123}
main{max-width:620px;margin:auto;padding:20px}
h1{font-size:24px;color:#0877bd;margin:5px 0 8px} p{line-height:1.4}
.card{background:#fff;padding:16px;border-radius:18px;box-shadow:0 6px 24px #0001}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#eee;touch-action:none}
.controls{display:grid;gap:12px;margin-top:15px}
button,.file{border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:16px;text-align:center;cursor:pointer}
.file{background:#0877bd;color:#fff;display:block}.file input{display:none}
button{background:#f5a400;color:#082d57}
button:disabled{opacity:.5}
label.zoom{font-weight:700} input[type=range]{width:100%}
small{display:block;text-align:center;color:#567;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>#FechadoComSérgioEODelegado</h1>
<p>Escolha sua foto, arraste para enquadrar e ajuste o zoom. Depois salve sua imagem pronta.</p>
<div class="card">
<canvas id="c" width="1080" height="1920"></canvas>
<div class="controls">
<label class="file">Escolher minha foto<input id="file" type="file" accept="image/*"></label>
<label class="zoom">Zoom <input id="zoom" type="range" min="1" max="3" value="1" step=".01"></label>
<button id="download" disabled>Baixar minha foto</button>
</div>
<small>Sua foto é processada no próprio aparelho e não é enviada para o site.</small>
</div>
</main>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const frame=new Image(), photo=new Image();
frame.src='design sem título.png';
let loaded=false, scale=1, ox=0, oy=0, base=1, dragging=false, sx=0, sy=0;
function draw(){
 ctx.clearRect(0,0,c.width,c.height);
 if(loaded){
   const w=photo.width*base*scale,h=photo.height*base*scale;
   ctx.drawImage(photo,(c.width-w)/2+ox,(c.height-h)/2+oy,w,h);
 }
 if(frame.complete) ctx.drawImage(frame,0,0,c.width,c.height);
}
frame.onload=draw;
document.getElementById('file').onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=()=>{photo.onload=()=>{
   loaded=true; scale=1; ox=oy=0;
   base=Math.max(c.width/photo.width,c.height/photo.height);
   document.getElementById('zoom').value=1;
   document.getElementById('download').disabled=false; draw();
 }; photo.src=r.result}; r.readAsDataURL(f);
};
document.getElementById('zoom').oninput=e=>{scale=+e.target.value;draw()};
function pos(e){const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return [(t.clientX-r.left)*c.width/r.width,(t.clientY-r.top)*c.height/r.height]}
function start(e){if(!loaded)return;dragging=true;[sx,sy]=pos(e);e.preventDefault()}
function move(e){if(!dragging)return;const [x,y]=pos(e);ox+=x-sx;oy+=y-sy;sx=x;sy=y;draw();e.preventDefault()}
function end(){dragging=false}
c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',end);
document.getElementById('download').onclick=()=>{
 const a=document.createElement('a');a.download='fechado-com-sergio-e-o-delegado.jpg';
 a.href=c.toDataURL('image/jpeg',.95);a.click();
};
</script>
</body></html>
